<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Release | PacMan SD - Wo Manini</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        swazi: {
                            red: '#8B2E2E',
                            blue: '#2E4466',
                            yellow: '#C4A000',
                        },
                        dark: '#0f0f0f'
                    },
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                        display: ['Syncopate', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;800&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0f0f0f;
            color: white;
            overflow-x: hidden;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        /* Animated Background */
        .bg-gradient-animate {
            background: linear-gradient(-45deg, #8B2E2E, #2E4466, #C4A000, #0f0f0f);
            background-size: 400% 400%;
            animation: gradient 15s ease infinite;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* Audio Player Styling */
        input[type="range"] {
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            height: 4px;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #C4A000;
            cursor: pointer;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen relative">

    <!-- Background Animation -->
    <div class="bg-gradient-animate opacity-60"></div>
    
    <!-- Click Outside Overlay (Redirects to Index) -->
    <a href="index.html#music" class="absolute inset-0 z-0 cursor-default" title="Click to go to tracklist"></a>

    <!-- Navigation -->
    <nav class="fixed w-full z-50 top-0 left-0 p-4 md:p-6 flex justify-between items-center bg-white shadow-md transition-all duration-300 border-b border-gray-100" id="navbar">
        <a href="index.html#home" class="font-display text-xl md:text-2xl font-bold tracking-tighter text-gray-900 hover:text-swazi-yellow transition-colors relative z-50">
            PM<span class="text-swazi-red">SD</span>
        </a>
        
        <!-- Desktop Menu -->
        <div class="hidden md:flex space-x-8 bg-white/70 backdrop-blur-sm px-8 py-3 rounded-full border border-gray-200">
            <a href="index.html#home" class="nav-link text-xs uppercase tracking-widest font-semibold text-gray-700 hover:text-gray-900">Home</a>
            <a href="index.html#music" class="nav-link text-xs uppercase tracking-widest font-semibold text-gray-700 hover:text-gray-900">Music</a>
            <a href="index.html#booking" class="nav-link text-xs uppercase tracking-widest font-semibold text-gray-700 hover:text-gray-900">Booking</a>
            <a href="index.html#gallery" class="nav-link text-xs uppercase tracking-widest font-semibold text-gray-700 hover:text-gray-900">Gallery</a>
            <a href="index.html#events" class="nav-link text-xs uppercase tracking-widest font-semibold text-gray-700 hover:text-gray-900">Events</a>
        </div>

        <div class="flex items-center gap-4">
            <a href="index.html#booking" class="hidden md:inline-block bg-swazi-red hover:bg-red-700 text-white px-6 py-2 rounded-full font-bold text-xs tracking-widest transition-all hover:scale-105 shadow-lg shadow-red-900/30">
                BOOK NOW
            </a>
            
            <!-- Mobile Menu Button -->
            <button id="mobile-menu-btn" class="md:hidden text-gray-900 text-2xl relative z-50 focus:outline-none p-2">
                <i class="fas fa-bars"></i>
            </button>
        </div>

        <!-- Mobile Menu Overlay -->
        <div id="mobile-menu" class="fixed inset-0 bg-white z-[40] flex flex-col justify-center items-center opacity-0 pointer-events-none transition-all duration-300">
            <div class="absolute inset-0 bg-swazi-pattern opacity-5"></div>
            <div class="flex flex-col space-y-6 text-center relative z-10">
                <a href="index.html#home" class="mobile-link text-3xl font-display font-bold text-gray-900 hover:text-swazi-red tracking-widest transition-colors">Home</a>
                <a href="index.html#music" class="mobile-link text-3xl font-display font-bold text-gray-900 hover:text-swazi-red tracking-widest transition-colors">Music</a>
                <a href="index.html#booking" class="mobile-link text-3xl font-display font-bold text-gray-900 hover:text-swazi-red tracking-widest transition-colors">Booking</a>
                <a href="index.html#gallery" class="mobile-link text-3xl font-display font-bold text-gray-900 hover:text-swazi-red tracking-widest transition-colors">Gallery</a>
                <a href="index.html#events" class="mobile-link text-3xl font-display font-bold text-gray-900 hover:text-swazi-red tracking-widest transition-colors">Events</a>
                <a href="index.html#booking" class="mobile-link inline-block bg-swazi-red text-white px-8 py-3 rounded-full font-bold text-sm tracking-widest shadow-lg shadow-red-900/40 mt-6">
                    BOOK NOW
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content Card -->
    <div class="relative z-10 glass-card p-6 md:p-10 rounded-3xl max-w-md w-full mx-4 text-center transform transition-all hover:scale-[1.01] duration-500 mt-20">
        
        <!-- Close Button -->
        <a href="index.html#music" class="absolute top-4 right-4 text-white/50 hover:text-white transition-colors">
            <i class="fas fa-times text-xl"></i>
        </a>
        
        <div class="mb-2 text-swazi-yellow font-display text-xs tracking-[0.2em] font-bold uppercase animate-pulse">
            New Release
        </div>
        
        <!-- Album Art -->
        <div class="w-48 h-48 md:w-64 md:h-64 mx-auto mb-6 rounded-2xl overflow-hidden shadow-2xl relative group">
            <img src="IMG-20260226-WA0033.jpg" alt="Wo Manini Cover" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-110">
            <div class="absolute inset-0 bg-black/30 group-hover:bg-black/10 transition-colors"></div>
            
            <!-- Play Button Overlay -->
            <button id="main-play-btn" class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                <div class="w-16 h-16 bg-swazi-yellow rounded-full flex items-center justify-center text-dark shadow-lg transform hover:scale-110 transition-transform">
                    <i class="fas fa-play text-2xl ml-1"></i>
                </div>
            </button>
        </div>
        
        <!-- Song Info -->
        <h1 class="font-display text-2xl md:text-3xl font-bold mb-1 text-white tracking-wide">WO MANINI</h1>
        <p class="text-gray-300 text-sm md:text-base font-medium mb-6">PacMan SD <span class="text-swazi-yellow">ft. Saphiwa</span></p>
        
        <!-- Player Controls -->
        <div class="space-y-4 mb-6">
            <!-- Progress Bar -->
            <div class="flex items-center space-x-3 text-xs text-gray-400">
                <span id="current-time">0:00</span>
                <input type="range" id="seek-slider" max="100" value="0" class="flex-1">
                <span id="duration">0:00</span>
            </div>
            
            <!-- Controls -->
            <div class="flex items-center justify-center space-x-6">
                <button id="rewind-btn" class="text-gray-400 hover:text-white transition-colors">
                    <i class="fas fa-backward"></i>
                </button>
                <button id="play-pause-btn" class="w-14 h-14 bg-white text-dark rounded-full flex items-center justify-center text-xl hover:bg-swazi-yellow transition-colors shadow-lg shadow-white/10">
                    <i class="fas fa-play ml-1"></i>
                </button>
                <button id="forward-btn" class="text-gray-400 hover:text-white transition-colors">
                    <i class="fas fa-forward"></i>
                </button>
            </div>
        </div>
        
        <!-- Actions -->
        <div class="space-y-3 mb-6">
            <a href="PacMan SD - Wo Manini [Feat. Saphiwa].mp3.mpeg" download="PacMan SD - Wo Manini [Feat. Saphiwa].mp3" class="w-full bg-swazi-blue hover:bg-blue-800 text-white py-3 rounded-xl text-xs font-bold uppercase tracking-wider transition-colors flex items-center justify-center space-x-2 shadow-lg shadow-blue-900/20">
                <i class="fas fa-download"></i>
                <span>Download Song</span>
            </a>
            <div class="grid grid-cols-2 gap-3">
                <button id="share-btn" class="bg-white/10 hover:bg-white/20 text-white py-3 rounded-xl text-xs font-bold uppercase tracking-wider transition-colors flex items-center justify-center space-x-2 border border-white/10">
                    <i class="fas fa-share-alt"></i>
                    <span>Share</span>
                </button>
                <a href="index.html#music" class="bg-transparent border border-white/20 hover:bg-white/10 text-white py-3 rounded-xl text-xs font-bold uppercase tracking-wider transition-colors flex items-center justify-center space-x-2">
                    <i class="fas fa-list"></i>
                    <span>Tracklist</span>
                </a>
            </div>
        </div>
        
        <div class="pt-4 border-t border-white/10">
            <p class="text-[10px] text-gray-500 uppercase tracking-widest">
                Tap anywhere outside to explore more music
            </p>
        </div>
    </div>

    <audio id="audio-player" src="PacMan SD - Wo Manini [Feat. Saphiwa].mp3.mpeg"></audio>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuBtn = document.getElementById('mobile-menu-btn');
            const menu = document.getElementById('mobile-menu');
            let isOpen = false;

            if (menuBtn && menu) {
                menuBtn.addEventListener('click', () => {
                    isOpen = !isOpen;
                    if (isOpen) {
                        menu.classList.remove('opacity-0', 'pointer-events-none');
                        menuBtn.innerHTML = '<i class="fas fa-times"></i>';
                        document.body.classList.add('overflow-hidden');
                    } else {
                        menu.classList.add('opacity-0', 'pointer-events-none');
                        menuBtn.innerHTML = '<i class="fas fa-bars"></i>';
                        document.body.classList.remove('overflow-hidden');
                    }
                });
            }

            const audio = document.getElementById('audio-player');
            const playPauseBtn = document.getElementById('play-pause-btn');
            const mainPlayBtn = document.getElementById('main-play-btn');
            const playIcon = playPauseBtn.querySelector('i');
            const seekSlider = document.getElementById('seek-slider');
            const currentTimeEl = document.getElementById('current-time');
            const durationEl = document.getElementById('duration');
            const rewindBtn = document.getElementById('rewind-btn');
            const forwardBtn = document.getElementById('forward-btn');
            
            let isPlaying = false;

            const togglePlay = () => {
                if (isPlaying) {
                    audio.pause();
                    playIcon.classList.remove('fa-pause');
                    playIcon.classList.add('fa-play');
                    playIcon.classList.add('ml-1'); // adjust centering
                } else {
                    audio.play();
                    playIcon.classList.remove('fa-play');
                    playIcon.classList.remove('ml-1');
                    playIcon.classList.add('fa-pause');
                }
                isPlaying = !isPlaying;
            };

            playPauseBtn.addEventListener('click', togglePlay);
            mainPlayBtn.addEventListener('click', togglePlay);

            audio.addEventListener('timeupdate', () => {
                const percent = (audio.currentTime / audio.duration) * 100;
                seekSlider.value = percent;
                currentTimeEl.textContent = formatTime(audio.currentTime);
            });

            audio.addEventListener('loadedmetadata', () => {
                durationEl.textContent = formatTime(audio.duration);
            });

            seekSlider.addEventListener('input', () => {
                const time = (seekSlider.value / 100) * audio.duration;
                audio.currentTime = time;
            });
            
            rewindBtn.addEventListener('click', () => {
                audio.currentTime = Math.max(0, audio.currentTime - 10);
            });
            
            forwardBtn.addEventListener('click', () => {
                audio.currentTime = Math.min(audio.duration, audio.currentTime + 10);
            });

            function formatTime(seconds) {
                if (!seconds || isNaN(seconds)) return "0:00";
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m}:${s.toString().padStart(2, '0')}`;
            }

            // Share functionality
            const shareBtn = document.getElementById('share-btn');
            if (shareBtn) {
                shareBtn.addEventListener('click', () => {
                    const shareUrl = window.location.href;
                    navigator.clipboard.writeText(shareUrl).then(() => {
                        showToast('Link copied to clipboard!');
                    }).catch(err => {
                        console.error('Failed to copy link: ', err);
                        showToast('Failed to copy link');
                    });
                });
            }

            function showToast(message) {
                let toast = document.getElementById('toast-notification');
                if (!toast) {
                    toast = document.createElement('div');
                    toast.id = 'toast-notification';
                    toast.className = 'fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-white text-dark px-6 py-3 rounded-full shadow-lg z-50 transition-opacity duration-300 opacity-0 pointer-events-none text-sm font-bold flex items-center gap-2';
                    document.body.appendChild(toast);
                }
                
                toast.innerHTML = `<i class="fas fa-check-circle text-green-500"></i> ${message}`;
                toast.classList.remove('opacity-0', 'pointer-events-none');
                
                setTimeout(() => {
                    toast.classList.add('opacity-0', 'pointer-events-none');
                }, 3000);
            }
        });
    </script>
</body>
</html>
